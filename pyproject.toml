[project]
name = "woodshed"
version = "0.1.0"
description = "Practice tool: song link -> stems -> readable sheet music, key/Camelot/BPM, chords and improv material"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "demucs>=4.0.1",
    "gradio>=6.16.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "librosa>=0.11.0",
    "mir-eval>=0.8.2",
    "music21>=10.3.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.26.0",
    "pretty-midi>=0.2.11",
    "pydantic>=2.13.4",
    "scipy>=1.17.1",
    "soundfile>=0.13.1",
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "torchcrepe>=0.0.24",
    "verovio>=5.0",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
woodshed = "woodshed.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symbolic", "src/woodshed"]

# CUDA build of torch on Windows/Linux (Demucs on the GPU is ~10x faster than CPU).
# torchaudio stops at 2.11, so torch is pinned to match.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
